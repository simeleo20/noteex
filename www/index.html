<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note Exerciser</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,sans-serif;background:#11151c;color:#e6edf3;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px}
h1{font-size:1.4rem;margin:8px 0 16px}
.panel{display:flex;flex-direction:column;gap:12px;align-items:center;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px 18px;margin-bottom:16px;width:100%;max-width:680px}
.pbody{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:center}
.slot{display:contents}
#home{gap:16px;padding:28px 18px}
.home-btn{width:100%;max-width:300px;padding:22px 14px;font-size:1.15rem;font-weight:700;border-radius:12px;justify-content:center}
.back-row{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:2px}
.back{padding:5px 12px;font-size:.85rem}
.err-line{color:#f85149;font-size:.9rem;width:100%;text-align:center}
#dpiano.mute .wkey,#dpiano.mute .bkey{cursor:default}
#dpiano.mute .wkey:hover{background:#e6edf3}
#dpiano.mute .bkey:hover{background:#161b22}
#summary{display:flex;align-items:center;gap:14px;width:100%;justify-content:center;font-size:1rem}
.mini-title{font-weight:800;font-size:1.05rem}
#gearBtn{padding:6px 16px;font-size:1rem}
.panel label{font-size:.8rem;color:#9aa4b2;display:flex;flex-direction:column;gap:4px}
.panel label.chk{flex-direction:row;align-items:center;gap:6px;font-size:.9rem;color:#e6edf3;padding-bottom:8px}
.panel label.chk input{width:16px;height:16px}
select,button{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:8px 14px;font-size:.95rem;cursor:pointer}
select:hover,button:hover{background:#30363d}
.primary{background:#238636;border-color:#2ea043;font-weight:600}
.primary:hover{background:#2ea043}
#game{display:flex;flex-direction:column;align-items:center;width:100%}
#score{font-size:1rem;margin-bottom:6px;color:#c9d1d9}
#staff{width:100%;max-width:640px;height:auto;background:#161b22;border:1px solid #30363d;border-radius:12px}
#feedback{height:1.6rem;margin-top:8px;font-size:1.15rem;font-weight:700}
#feedback.ok{color:#3fb950}
#feedback.bad{color:#f85149}
#micStatus{height:1.6rem;margin-top:8px;font-size:1.25rem;font-weight:700;color:#79c0ff}
#buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.note-btn{min-width:74px;padding:14px 10px;font-size:1.15rem;font-weight:600;border-radius:10px}
.note-btn.ok{background:#238636;border-color:#3fb950;transform:scale(1.08)}
.note-btn.bad{background:#b62324;border-color:#f85149;transform:scale(0.94)}
.note-btn.reveal{border-color:#3fb950;color:#3fb950}
#piano{display:flex;flex-direction:column;width:100%;max-width:640px;margin-top:10px;user-select:none}
.prow{position:relative;display:flex;width:100%;height:150px}
.wkey{flex:1;background:#e6edf3;border:1px solid #30363d;border-radius:0 0 6px 6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;color:#111;font-size:.85rem;font-weight:600;cursor:pointer}
.wkey:hover{background:#fff}
.bkey{position:absolute;top:0;height:62%;z-index:2;background:#161b22;border:1px solid #010409;border-radius:0 0 4px 4px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;color:#aaa;font-size:.58rem;font-weight:600;cursor:pointer}
.bkey:hover{background:#30363d}
.wkey.ok,.bkey.ok{background:#3fb950!important;color:#04260a}
.wkey.bad,.bkey.bad{background:#f85149!important;color:#2d0505}
.wkey.reveal{box-shadow:inset 0 0 0 3px #238636}
.hint{color:#9aa4b2;font-size:.8rem;margin:10px 0 0}
.kofi{flex-basis:100%;text-align:center;color:#9aa4b2;font-size:.8rem;text-decoration:none}
.kofi:hover{color:#e6edf3}
#detect{display:flex;flex-direction:column;align-items:center;width:100%;gap:10px}
.det-note{font-size:3.2rem;font-weight:800;line-height:1.05}
.det-cents{height:1.3rem;color:#9aa4b2;font-size:1rem}
#tuner{position:relative;width:100%;max-width:480px;height:46px;background:#161b22;border:1px solid #30363d;border-radius:10px;overflow:hidden}
#tuner .band{position:absolute;left:46%;top:0;bottom:0;width:8%;background:rgba(63,185,80,.22)}
#tuner .tick{position:absolute;top:0;bottom:0;width:1px;background:#30363d}
#tuner .tick.mid{background:#3fb950}
#tuner .tlab{position:absolute;bottom:2px;font-size:.62rem;color:#6e7681;transform:translateX(-50%)}
#needle{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#79c0ff;border-radius:2px;left:50%;transition:left .08s linear}
#lvl{width:100%;max-width:480px;height:6px;background:#21262d;border-radius:3px;overflow:hidden}
#lvl i{display:block;height:100%;width:0;background:#79c0ff}
#detStatus{height:1.6rem;font-weight:700;color:#79c0ff;font-size:1.1rem}
#detStatus.err{color:#f85149}
#dpiano{display:flex;flex-direction:column;width:100%;max-width:640px;user-select:none}
.det-row{display:flex;gap:10px;align-items:center;font-size:.85rem;color:#9aa4b2;flex-wrap:wrap;justify-content:center}
input[type=range]{accent-color:#238636}
@media (max-width:600px){
  h1{font-size:1.05rem;margin:4px 0 10px}
  .panel{padding:10px 12px}
  .note-btn{min-width:58px;padding:12px 6px;font-size:1.05rem}
  .prow{height:130px}
  .hint{margin-top:6px}
  .det-note{font-size:2.4rem}
}
</style>
</head>
<body>
<h1>🎼 Note Exerciser</h1>

<nav id="home" class="panel">
  <button id="goPractice" class="home-btn">🎼 Practice reading</button>
  <button id="goListen" class="home-btn">🎧 Listen &amp; tune</button>
  <a class="kofi" href="https://ko-fi.com/simelab" target="_blank" rel="noopener">☕ Support this project</a>
</nav>

<section id="setupPractice" class="panel" hidden>
  <div class="back-row">
    <button class="back js-home">← Home</button>
    <span class="mini-title">🎼 Practice</span>
  </div>
  <div id="panelBody" class="pbody">
    <label>Clef
      <select id="clef">
        <option value="treble">Treble</option>
        <option value="bass">Bass</option>
        <option value="alto">Alto</option>
        <option value="tenor">Tenor</option>
      </select>
    </label>
    <span id="pRange" class="slot"><span id="rangePair">
      <label>Lowest note <select id="rangeFrom"></select></label>
      <label>Highest note <select id="rangeTo"></select></label>
    </span></span>
    <label>Answer
      <select id="answerMode">
        <option value="buttons">Buttons</option>
        <option value="mic-relative">Microphone · relative</option>
        <option value="mic-exact">Microphone · exact</option>
        <option value="piano-relative">Piano · relative</option>
        <option value="piano-exact">Piano · exact</option>
      </select>
    </label>
    <span id="pNames" class="slot"><span id="namesPair">
      <label>Note names
        <select class="js-names">
          <option value="it">Do Re Mi · Solfège</option>
          <option value="en">C D E · Letters</option>
        </select>
      </label>
    </span></span>
    <span id="pLabels" class="slot"><span id="labelsPair">
      <label class="chk"><input type="checkbox" id="pianoLabels" checked> Key labels</label>
    </span></span>
    <label class="chk"><input type="checkbox" id="optMistakes"> Repeat mistakes</label>
    <label class="chk"><input type="checkbox" id="optLeaps"> Big leaps</label>
    <button id="startBtn" class="primary">▶ Start</button>
    <div id="quizErr" class="err-line" hidden></div>
  </div>
  <div id="summary" hidden>
    <span class="mini-title">🎼 Practice</span>
    <span id="score"></span>
    <button id="gearBtn" title="Settings">⚙</button>
    <button id="homeBtn" title="Home">⌂</button>
  </div>
  <button id="collapseBtn" hidden>▲ Collapse</button>
</section>

<section id="setupListen" class="panel" hidden>
  <div class="back-row">
    <button class="back js-home">← Home</button>
    <span class="mini-title">🎧 Listen</span>
  </div>
  <div class="pbody">
    <span id="lNames" class="slot"></span>
    <span id="lRange" class="slot"></span>
    <span id="lLabels" class="slot"></span>
    <button id="listenBtn" class="primary">▶ Start listening</button>
  </div>
</section>

<div id="game" hidden>
  <svg id="staff" viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="micStatus" hidden></div>
  <div id="feedback"></div>
  <div id="buttons"></div>
  <div id="piano" hidden></div>
  <p class="hint" id="hint">Answer by clicking or pressing keys 1–7</p>
  <button id="stopBtn">⏹ Stop</button>
</div>

<section id="detect" hidden>
  <div class="det-row">
    <span>Mic sensitivity</span>
    <input type="range" id="detSens" min="1" max="12" step="1" value="9">
  </div>
  <div class="det-note" id="detNote">—</div>
  <div class="det-cents" id="detCents">&nbsp;</div>
  <div id="tuner">
    <div class="band"></div>
    <div class="tick" style="left:0%"></div>
    <div class="tick" style="left:25%"></div>
    <div class="tick mid" style="left:50%"></div>
    <div class="tick" style="left:75%"></div>
    <div class="tick" style="left:100%"></div>
    <span class="tlab" style="left:2%">−50¢</span>
    <span class="tlab" style="left:25%">−25¢</span>
    <span class="tlab" style="left:50%">0</span>
    <span class="tlab" style="left:75%">+25¢</span>
    <span class="tlab" style="left:98%">+50¢</span>
    <div id="needle"></div>
  </div>
  <div id="lvl"><i></i></div>
  <div id="detStatus">🎤 Listening…</div>
  <div id="dpiano"></div>
  <p class="hint">Play any instrument — notes appear live.</p>
  <button id="detStop">⏹ Back</button>
</section>

<script>
'use strict';
const $ = id => document.getElementById(id);
const NAMES_IT = ['Do','Re','Mi','Fa','Sol','La','Si'];
const NAMES_EN = ['C','D','E','F','G','A','B'];
const SEMI = [0,2,4,5,7,9,11];
const CLEFS = {
  treble:{name:'Treble',   glyph:'\u{1D11E}', bottom:30, clefY:270, fs:95},
  bass:  {name:'Bass',     glyph:'\u{1D122}', bottom:18, clefY:265, fs:78},
  alto:  {name:'Alto', glyph:'\u{1D121}', bottom:24, clefY:270, fs:88},
  tenor: {name:'Tenor',    glyph:'\u{1D121}', bottom:22, clefY:250, fs:88}
};
const DEFAULT_RANGE = {treble:[28,39], bass:[14,25], alto:[21,32], tenor:[21,32]};

const CHROMATIC_IT = ['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const CHROMATIC_EN = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];

const state = {clef:'treble', from:28, to:39, it:true, cur:null, last:null, mode:'buttons',
               score:0, total:0, streak:0, best:0, awaiting:false, running:false, locked:false, lockPitch:-999,
               repeatMistakes:false, bigLeaps:false};
const mistakes = {};
let analyser = null, micStream = null, micTimer = null;
let stableCount = 0, lastCandidate = -999;
let lockFrames = 0, silentFrames = 0;
function unlockMic(){
  state.locked = false;
  lockFrames = 0; silentFrames = 0;
  stableCount = 0; lastCandidate = -999;
}

function isMicMode(){ return state.mode.startsWith('mic'); }
function isPianoMode(){ return state.mode.startsWith('piano'); }

/* ---------- audio ---------- */
let actx = null;
function ensureAudio(){
  if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === 'suspended') actx.resume();
}
function tone(f, t0, dur, type, vol){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function midiFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function playNote(freq){
  ensureAudio();
  tone(freq, actx.currentTime, 0.7, 'triangle', 0.22);
}
function correctSound(){
  ensureAudio();
  const t = actx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((f,k) => tone(f, t + k*0.07, 0.18, 'sine', 0.2));
}
function wrongSound(){
  ensureAudio();
  const t = actx.currentTime;
  const o1 = actx.createOscillator(), o2 = actx.createOscillator();
  const g = actx.createGain(), fl = actx.createBiquadFilter();
  o1.type = 'sawtooth'; o2.type = 'sawtooth';
  o1.frequency.setValueAtTime(220, t); o1.frequency.exponentialRampToValueAtTime(110, t + 0.45);
  o2.frequency.setValueAtTime(233, t); o2.frequency.exponentialRampToValueAtTime(116, t + 0.45);
  fl.type = 'lowpass'; fl.frequency.value = 900;
  g.gain.setValueAtTime(0.28, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  o1.connect(fl); o2.connect(fl); fl.connect(g); g.connect(actx.destination);
  o1.start(t); o2.start(t); o1.stop(t + 0.55); o2.stop(t + 0.55);
}

/* ---------- staff rendering ---------- */
function diaToY(d, clef){ return 310 - (d - CLEFS[clef].bottom) * 10; }
function renderStaff(n){
  const c = CLEFS[state.clef];
  const ny = diaToY(n.dia, state.clef);
  let s = '';
  for(let k = 0; k < 5; k++){
    const y = 230 + k * 20;
    s += `<line x1="40" y1="${y}" x2="560" y2="${y}" stroke="#8b949e" stroke-width="1.5"/>`;
  }
  const ledger = p => {
    const y = diaToY(p, state.clef);
    return `<line x1="272" y1="${y}" x2="328" y2="${y}" stroke="#8b949e" stroke-width="1.5"/>`;
  };
  const top = c.bottom + 8;
  if(n.dia > top){
    const end = n.dia + (((n.dia - c.bottom) % 2 === 0) ? 0 : 1);
    for(let p = top + 2; p <= end; p += 2) s += ledger(p);
  }
  if(n.dia < c.bottom){
    const end = n.dia - (((n.dia - c.bottom) % 2 === 0) ? 0 : 1);
    for(let p = c.bottom - 2; p >= end; p -= 2) s += ledger(p);
  }
  s += `<text x="75" y="${c.clefY}" font-size="${c.fs}" fill="#e6edf3" text-anchor="middle" dominant-baseline="central" font-family="'Noto Music','Bravura','Segoe UI Symbol','Apple Symbols',serif">${c.glyph}</text>`;
  const y = ny;
  s += `<ellipse cx="300" cy="${y}" rx="10" ry="7" fill="#e6edf3" transform="rotate(-15 300 ${y})"/>`;
  $('staff').innerHTML = s;
  let half = 62;
  try {
    const bb = $('staff').getBBox();
    if(bb.height > 0) half = Math.max(half, 270 - bb.y, bb.y + bb.height - 270);
  } catch(e){}
  $('staff').setAttribute('viewBox', `0 ${Math.round(270 - half - 10)} 600 ${Math.round(2 * (half + 10))}`);
}

/* ---------- game logic ---------- */
function randNote(){
  let d;
  if(state.repeatMistakes || state.bigLeaps){
    const cands = [];
    for(let c = state.from; c <= state.to; c++){
      if(c === state.last && state.to > state.from) continue;
      let w = 1;
      if(state.repeatMistakes) w *= Math.sqrt(mistakes[c] || 1);
      if(state.bigLeaps){
        const dist = state.last === null ? state.to - state.from : Math.abs(c - state.last);
        w *= (dist + 1) * (dist + 1);
      }
      cands.push([c, w]);
    }
    let total = 0;
    for(const [,w] of cands) total += w;
    let r = Math.random() * total;
    d = cands[cands.length - 1][0];
    for(const [c,w] of cands){ r -= w; if(r <= 0){ d = c; break; } }
  } else {
    do { d = state.from + Math.floor(Math.random() * (state.to - state.from + 1)); }
    while(d === state.last && state.to > state.from);
  }
  state.last = d;
  return {dia:d, o:Math.floor(d / 7), i:d % 7};
}
function noteMidi(n){ return 12 * (n.o + 1) + SEMI[n.i]; }
function nextNote(){
  if(!state.running) return;
  state.cur = randNote();
  state.awaiting = true;
  renderStaff(state.cur);
  if(!isMicMode()) playNote(midiFreq(state.cur));
}
function updateScore(){
  $('score').textContent = `✅ ${state.score}/${state.total} · 🔥 streak ${state.streak} · 🏆 best ${state.best}`;
}
function answer(i){
  if(!state.awaiting || !state.running) return;
  const btn = document.querySelectorAll('#buttons button')[i];
  answerValue(i === state.cur.i, btn);
}
function answerValue(ok, pressedIdx){
  state.awaiting = false;
  state.total++;
  const k = state.cur.dia;
  if(ok){
    state.score++; state.streak++; state.best = Math.max(state.best, state.streak); correctSound();
    if(state.repeatMistakes) mistakes[k] = Math.max(1, (mistakes[k] || 1) - 1);
  } else {
    state.streak = 0; wrongSound();
    if(state.repeatMistakes) mistakes[k] = (mistakes[k] || 1) + 4;
  }
  updateScore();
  flash(ok, pressedIdx);
  setTimeout(nextNote, ok ? 450 : 1000);
}
function flash(ok, pressedEl){
  let correctEl;
  if(isPianoMode()) correctEl = document.querySelector(`.wkey[data-dia="${state.cur.dia}"]`);
  else correctEl = document.querySelectorAll('#buttons button')[state.cur.i];
  if(correctEl) correctEl.classList.add(ok ? 'ok' : 'reveal');
  if(!ok && pressedEl) pressedEl.classList.add('bad');
  const fb = $('feedback');
  fb.textContent = ok ? '✔ Correct!' : `✘ It was ${(state.it ? NAMES_IT : NAMES_EN)[state.cur.i]}${state.cur.o}`;
  fb.className = ok ? 'ok' : 'bad';
  setTimeout(() => {
    document.querySelectorAll('.note-btn,.wkey,.bkey').forEach(b => b.classList.remove('ok','bad','reveal'));
  }, ok ? 400 : 950);
}

/* ---------- microfono ---------- */
async function startMic(){
  ensureAudio();
  micStream = await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}
  });
  const src = actx.createMediaStreamSource(micStream);
  analyser = actx.createAnalyser();
  analyser.fftSize = 2048;
  src.connect(analyser);
}
function stopMic(){
  if(micTimer){ clearInterval(micTimer); micTimer = null; }
  if(micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  analyser = null;
}
function midiFromFreq(f){ return 69 + 12 * Math.log2(f / 440); }
function autoCorrelate(buf, sampleRate, minRms = 0.015){
  const SIZE = buf.length;
  let rms = 0;
  for(let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if(rms < minRms) return -1;
  let r1 = 0, r2 = SIZE - 1;
  const thres = 0.2;
  for(let i = 0; i < SIZE / 2; i++) if(Math.abs(buf[i]) < thres){ r1 = i; break; }
  for(let i = 1; i < SIZE / 2; i++) if(Math.abs(buf[SIZE - i]) < thres){ r2 = SIZE - i; break; }
  const b = buf.slice(r1, r2);
  const N = b.length;
  if(N < 64) return -1;
  const c = new Float32Array(N);
  for(let i = 0; i < N; i++)
    for(let j = 0; j < N - i; j++)
      c[i] += b[j] * b[j + i];
  let d = 0;
  while(d < N - 1 && c[d] > c[d + 1]) d++;
  let maxval = -1;
  for(let i = d; i < N; i++) if(c[i] > maxval) maxval = c[i];
  if(maxval <= 0) return -1;
  /* first local peak reaching 90% of the global max: the global max can sit on
     a multiple of the true period (2T -> octave-below jumps) */
  let T0 = -1;
  for(let i = Math.max(d, 1); i < N - 1; i++){
    if(c[i] >= c[i - 1] && c[i] >= c[i + 1] && c[i] >= 0.9 * maxval){ T0 = i; break; }
  }
  if(T0 < 0) return -1;
  const x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
  const a = (x1 + x3 - 2 * x2) / 2, bb = (x3 - x1) / 2;
  if(a) T0 = T0 - bb / (2 * a);
  return sampleRate / T0;
}
function micLoop(){
  if(!state.running || !isMicMode() || !analyser) return;
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  const f = autoCorrelate(buf, actx.sampleRate);
  const el = $('micStatus');
  if(f > 0){
    const m = midiFromFreq(f);
    const cand = Math.round(m);
    const pcNames = state.it ? CHROMATIC_IT : CHROMATIC_EN;
    const cents = Math.round((m - cand) * 100);
    el.textContent = `🎤 ${pcNames[((cand % 12) + 12) % 12]}${Math.floor(cand / 12) - 1} (${cents > 0 ? '+' : ''}${cents}¢)${state.locked ? ' ⏸' : ''}`;
    if(state.locked){
      silentFrames = 0;
      if(cand === state.lockPitch){ lockFrames = 0; }
      else {
        lockFrames++;
        if(lockFrames >= 3) unlockMic();
      }
      return;
    }
    if(cand === lastCandidate) stableCount++;
    else { stableCount = 1; lastCandidate = cand; }
    if(stableCount >= 4 && state.awaiting){
      const ok = state.mode === 'mic-exact'
        ? cand === noteMidi(state.cur)
        : ((cand % 12) + 12) % 12 === SEMI[state.cur.i];
      stableCount = 0; lastCandidate = -999;
      state.locked = true; state.lockPitch = cand; lockFrames = 0;
      answerValue(ok);
    }
  } else {
    el.textContent = state.locked ? '🎤 ⏸' : '🎤 Listening…';
    stableCount = 0; lastCandidate = -999;
    if(state.locked){
      silentFrames++;
      if(silentFrames >= 2) unlockMic();
    }
  }
}

/* ---------- ui ---------- */
function buildButtons(){
  const box = $('buttons');
  box.innerHTML = '';
  for(let i = 0; i < 7; i++){
    const b = document.createElement('button');
    b.className = 'note-btn';
    b.addEventListener('click', () => answer(i));
    box.appendChild(b);
  }
  relabel();
}
function relabel(){
  [...document.querySelectorAll('#buttons button')].forEach((b,i) => {
    b.textContent = (state.it ? NAMES_IT : NAMES_EN)[i];
  });
}
function buildPiano(box = $('piano'), forceRange = false, interactive = true){
  box.innerHTML = '';
  box.classList.toggle('mute', !interactive);
  let dias = [];
  const rel = !forceRange && state.mode === 'piano-relative';
  if(rel){
    for(let i = 0; i < 7; i++) dias.push(28 + i);
  } else {
    const start = Math.floor(state.from / 7) * 7;
    const end = state.to % 7 === 0 ? state.to : Math.floor(state.to / 7) * 7 + 6;
    for(let dia = start; dia <= end; dia++) dias.push(dia);
  }
  const showLabels = $('pianoLabels').checked;
  const names = state.it ? NAMES_IT : NAMES_EN;
  const SHARP_IT = {0:'Do♯',1:'Re♯',3:'Fa♯',4:'Sol♯',5:'La♯'};
  const SHARP_EN = {0:'C♯',1:'D♯',3:'F♯',4:'G♯',5:'A♯'};
  const sh = state.it ? SHARP_IT : SHARP_EN;
  const N = dias.length;
  const segs = [];
  let curSeg = [];
  dias.forEach(dia => {
    if(dia % 7 === 0 && curSeg.length){ segs.push(curSeg); curSeg = []; }
    curSeg.push(dia);
  });
  if(curSeg.length) segs.push(curSeg);
  const availW = Math.max(280, Math.min(document.documentElement.clientWidth - 32, 1400));
  const minKeyW = 34;
  const packMax = R => {
    let lo = Math.max(...segs.map(s => s.length)), hi = N;
    const fitsRows = M => {
      let r = 1, a = 0;
      for(const g of segs){
        if(a + g.length > M){ r++; a = 0; }
        a += g.length;
      }
      return r <= R;
    };
    while(lo < hi){ const m = (lo + hi) >> 1; if(fitsRows(m)) hi = m; else lo = m + 1; }
    return lo;
  };
  let R = 1;
  while(R < segs.length && packMax(R) * minKeyW > availW) R++;
  const cap = packMax(R);
  const rows = [];
  let row = [], acc = 0;
  for(const g of segs){
    if(acc + g.length > cap && row.length){ rows.push(row); row = []; acc = 0; }
    row.push(...g);
    acc += g.length;
  }
  if(row.length) rows.push(row);
  const multiRow = rows.length > 1;
  const maxLen = Math.max(...rows.map(r => r.length));
  const gw = 100 / maxLen, gb = gw * 0.6;
  box.style.maxWidth = (multiRow || N > 14) ? availW + 'px' : '';
  rows.forEach(rowDias => {
    const row = document.createElement('div');
    row.className = 'prow';
    if(multiRow){
      const maxTotal = window.innerWidth <= 600 ? 264 : 320;
      row.style.height = Math.max(56, Math.floor(maxTotal / rows.length)) + 'px';
    }
    const M = rowDias.length;
    rowDias.forEach(dia => {
      const k = document.createElement('div');
      k.className = 'wkey';
      k.style.flex = `0 1 ${gw}%`;
      k.dataset.dia = dia;
      k.dataset.midi = 12 * (Math.floor(dia / 7) + 1) + SEMI[dia % 7];
      if(showLabels) k.textContent = names[dia % 7] + (rel ? '' : Math.floor(dia / 7));
      if(interactive) k.addEventListener('click', () => pianoAnswer(dia, k));
      row.appendChild(k);
    });
    for(let j = 0; j < M - 1; j++){
      const lo = rowDias[j], i = lo % 7;
      if(rowDias[j + 1] - lo !== 1 || !(i in sh)) continue;
      const b = document.createElement('div');
      b.className = 'bkey';
      b.style.left = (((j + 1) * gw) - gb / 2) + '%';
      b.style.width = gb + '%';
      if(showLabels) b.textContent = sh[i];
      const midi = 12 * (Math.floor(lo / 7) + 1) + SEMI[i] + 1;
      b.dataset.midi = midi;
      if(interactive) b.addEventListener('click', () => playNote(midiFreq(midi)));
      row.appendChild(b);
    }
    box.appendChild(row);
  });
}
function pianoAnswer(dia, el){
  if(!state.awaiting || !state.running) return;
  const n = {dia, o:Math.floor(dia / 7), i:dia % 7};
  playNote(midiFreq(noteMidi(n)));
  const ok = state.mode === 'piano-exact' ? dia === state.cur.dia : n.i === state.cur.i;
  answerValue(ok, el);
}
let rzT;
addEventListener('resize', () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => {
    if(state.running && isPianoMode()) buildPiano();
    else if(det.running) buildPiano($('dpiano'), true, false);
  }, 150);
});
(function initRanges(){
  for(const sel of [$('rangeFrom'), $('rangeTo')]){
    for(let d = 14; d <= 56; d++){
      const o = Math.floor(d / 7), i = d % 7;
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = `${NAMES_EN[i]}${o} (${NAMES_IT[i]}${o})`;
      sel.appendChild(opt);
    }
  }
  $('rangeFrom').value = 28;
  $('rangeTo').value = 39;
})();
$('clef').addEventListener('change', () => {
  const [a,b] = DEFAULT_RANGE[$('clef').value];
  $('rangeFrom').value = a;
  $('rangeTo').value = b;
});
$('startBtn').addEventListener('click', async () => {
  ensureAudio();
  stopDetect();
  stopMic();
  state.mode = $('answerMode').value;
  state.it = namesValue() === 'it';
  $('quizErr').hidden = true;
  let a = +$('rangeFrom').value, b = +$('rangeTo').value;
  if(a > b) [a,b] = [b,a];
  state.from = a; state.to = b;
  state.clef = $('clef').value;
  state.score = 0; state.total = 0; state.streak = 0; state.best = 0; state.last = null;
  state.locked = false; lockFrames = 0; silentFrames = 0;
  state.repeatMistakes = $('optMistakes').checked;
  state.bigLeaps = $('optLeaps').checked;
  for(const k in mistakes) delete mistakes[k];
  const mic = isMicMode(), piano = isPianoMode();
  if(mic){
    try {
      await startMic();
    } catch(err) {
      $('quizErr').textContent = '⚠ Cannot access the microphone';
      $('quizErr').hidden = false;
      return;
    }
  }
  state.running = true;
  $('game').hidden = false;
  $('feedback').textContent = '';
  $('buttons').hidden = mic || piano;
  $('piano').hidden = !piano;
  $('micStatus').hidden = !mic;
  $('hint').textContent =
    mic  ? (state.mode === 'mic-exact'   ? 'Sing the exact note!' : 'Sing the note: any octave works!') :
    piano? (state.mode === 'piano-exact' ? 'Press the exact key!' : 'Press the right key: any octave works!') :
           'Answer by clicking or pressing keys 1–7';
  if(mic){ stableCount = 0; lastCandidate = -999; micTimer = setInterval(micLoop, 80); }
  else if(piano) buildPiano();
  else relabel();
  collapsePanel();
  updateScore();
  nextNote();
});
function collapsePanel(){
  $('summary').hidden = false;
  $('panelBody').hidden = true;
}
$('gearBtn').addEventListener('click', () => {
  $('summary').hidden = true;
  $('panelBody').hidden = false;
  $('collapseBtn').hidden = !state.running;
});
$('collapseBtn').addEventListener('click', () => {
  if(state.running) collapsePanel();
});
$('stopBtn').addEventListener('click', () => {
  state.running = false;
  state.awaiting = false;
  stopMic();
  $('game').hidden = true;
  $('summary').hidden = true;
  $('panelBody').hidden = false;
  $('collapseBtn').hidden = true;
});
document.addEventListener('keydown', e => {
  if($('game').hidden || isMicMode()) return;
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= 7) answer(n - 1);
});

/* ---------- navigation ---------- */
function namesValue(){ return document.querySelector('.js-names').value; }
function syncNames(v){
  document.querySelectorAll('.js-names').forEach(s => s.value = v);
  state.it = v === 'it';
  relabel();
}
document.querySelectorAll('.js-names').forEach(s =>
  s.addEventListener('change', e => syncNames(e.target.value)));
function openPanel(which){
  const m = which === 'p'
    ? {range:'pRange', names:'pNames', labels:'pLabels'}
    : {range:'lRange', names:'lNames', labels:'lLabels'};
  $(m.range).append($('rangePair'));
  $(m.names).append($('namesPair'));
  $(m.labels).append($('labelsPair'));
}
function showHome(){
  stopDetect();
  state.running = false; state.awaiting = false;
  stopMic();
  $('game').hidden = true;
  $('setupPractice').hidden = true;
  $('setupListen').hidden = true;
  $('summary').hidden = true;
  $('panelBody').hidden = false;
  $('collapseBtn').hidden = true;
  $('quizErr').hidden = true;
  $('home').hidden = false;
}
$('goPractice').addEventListener('click', () => {
  $('home').hidden = true;
  openPanel('p');
  $('setupPractice').hidden = false;
});
$('goListen').addEventListener('click', () => {
  $('home').hidden = true;
  openPanel('l');
  $('setupListen').hidden = false;
});
document.querySelectorAll('.js-home').forEach(b => b.addEventListener('click', showHome));
$('homeBtn').addEventListener('click', showHome);

/* ---------- listen mode (real-time note detector) ---------- */
const det = {running:false};
let detLastMidi = -999;
const detGate = () => 0.065 - 0.005 * (+$('detSens').value);
function stopDetect(){
  if(det.running){ det.running = false; stopMic(); }
  document.querySelectorAll('#dpiano .ok').forEach(k => k.classList.remove('ok'));
  $('detect').hidden = true;
}
function detLoop(){
  if(!det.running || !analyser) return;
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  let rms = 0;
  for(let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / buf.length);
  $('lvl').firstElementChild.style.width = Math.min(100, rms * 500) + '%';
  const f = autoCorrelate(buf, actx.sampleRate, detGate());
  const pcNames = state.it ? CHROMATIC_IT : CHROMATIC_EN;
  document.querySelectorAll('#dpiano .ok').forEach(k => k.classList.remove('ok'));
  if(f > 0){
    const m = midiFromFreq(f);
    const cand = Math.round(m);
    const cents = Math.round((m - cand) * 100);
    detLastMidi = cand;
    $('detNote').textContent = `${pcNames[((cand % 12) + 12) % 12]}${Math.floor(cand / 12) - 1}`;
    $('detCents').textContent = `${cents > 0 ? '+' : ''}${cents}¢`;
    $('needle').style.left = (50 + Math.max(-50, Math.min(50, cents))) + '%';
    const key = document.querySelector(`#dpiano [data-midi="${cand}"]`);
    if(key) key.classList.add('ok');
    $('detStatus').className = '';
    $('detStatus').textContent = '🎤 Listening…';
  } else {
    detLastMidi = -999;
    $('detNote').textContent = '—';
    $('detCents').innerHTML = '&nbsp;';
    $('needle').style.left = '50%';
    $('detStatus').className = 'err';
    $('detStatus').textContent = rms >= detGate() ? '🎤 Too much noise — raise sensitivity?' : '🎤 Listening…';
  }
}
$('listenBtn').addEventListener('click', async () => {
  ensureAudio();
  stopDetect();
  state.running = false; state.awaiting = false;
  $('game').hidden = true;
  state.it = namesValue() === 'it';
  let a = +$('rangeFrom').value, b = +$('rangeTo').value;
  if(a > b) [a,b] = [b,a];
  state.from = a; state.to = b;
  const st = $('detStatus');
  st.className = ''; st.textContent = '🎤 Listening…';
  try {
    await startMic();
  } catch(err){
    st.className = 'err';
    st.textContent = '⚠ Cannot access the microphone';
  }
  det.running = true;
  buildPiano($('dpiano'), true, false);
  $('setupListen').hidden = true;
  $('detect').hidden = false;
  micTimer = setInterval(detLoop, 80);
});
$('detStop').addEventListener('click', () => {
  stopDetect();
  $('setupListen').hidden = false;
});

/* ---------- preferences ---------- */
function savePrefs(){
  try {
    localStorage.setItem('noteex-prefs', JSON.stringify({
      clef:$('clef').value, from:+$('rangeFrom').value, to:+$('rangeTo').value,
      mode:$('answerMode').value, names:namesValue(),
      labels:$('pianoLabels').checked, mistakes:$('optMistakes').checked,
      leaps:$('optLeaps').checked, sens:+$('detSens').value
    }));
  } catch(e){}
}
try {
  const p = JSON.parse(localStorage.getItem('noteex-prefs') || '{}');
  if(p.clef) $('clef').value = p.clef;
  if(p.from){ $('rangeFrom').value = p.from; $('rangeTo').value = p.to; }
  if(p.mode) $('answerMode').value = p.mode;
  if(p.names) document.querySelectorAll('.js-names').forEach(s => s.value = p.names);
  if(p.labels === false) $('pianoLabels').checked = false;
  if(p.mistakes) $('optMistakes').checked = true;
  if(p.leaps) $('optLeaps').checked = true;
  if(p.sens) $('detSens').value = p.sens;
} catch(e){}
state.it = namesValue() === 'it';
document.addEventListener('change', savePrefs);
document.addEventListener('input', savePrefs);

buildButtons();
</script>
