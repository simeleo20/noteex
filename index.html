<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note Exerciser</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,sans-serif;background:#11151c;color:#e6edf3;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px}
h1{font-size:1.4rem;margin:8px 0 16px}
.panel{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:center;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px 18px;margin-bottom:16px}
.panel label{font-size:.8rem;color:#9aa4b2;display:flex;flex-direction:column;gap:4px}
.panel label.chk{flex-direction:row;align-items:center;gap:6px;font-size:.9rem;color:#e6edf3;padding-bottom:8px}
.panel label.chk input{width:16px;height:16px}
select,button{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:8px 14px;font-size:.95rem;cursor:pointer}
select:hover,button:hover{background:#30363d}
.primary{background:#238636;border-color:#2ea043;font-weight:600}
.primary:hover{background:#2ea043}
#game{display:flex;flex-direction:column;align-items:center;width:100%;max-width:680px}
#score{font-size:1rem;margin-bottom:6px;color:#c9d1d9}
#staff{width:100%;max-width:640px;height:auto;background:#161b22;border:1px solid #30363d;border-radius:12px}
#feedback{height:1.6rem;margin-top:8px;font-size:1.15rem;font-weight:700}
#feedback.ok{color:#3fb950}
#feedback.bad{color:#f85149}
#micStatus{height:1.6rem;margin-top:8px;font-size:1.25rem;font-weight:700;color:#79c0ff}
#buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.note-btn{min-width:74px;padding:14px 10px;font-size:1.15rem;font-weight:600;border-radius:10px}
.note-btn.ok{background:#238636;border-color:#3fb950;transform:scale(1.08)}
.note-btn.bad{background:#b62324;border-color:#f85149;transform:scale(0.94)}
.note-btn.reveal{border-color:#3fb950;color:#3fb950}
#piano{position:relative;display:flex;width:100%;max-width:640px;height:150px;margin-top:10px;user-select:none}
.wkey{flex:1;background:#e6edf3;border:1px solid #30363d;border-radius:0 0 6px 6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;color:#111;font-size:.85rem;font-weight:600;cursor:pointer}
.wkey:hover{background:#fff}
.bkey{position:absolute;top:0;height:62%;z-index:2;background:#161b22;border:1px solid #010409;border-radius:0 0 4px 4px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;color:#aaa;font-size:.58rem;font-weight:600;cursor:pointer}
.bkey:hover{background:#30363d}
.wkey.ok,.bkey.ok{background:#3fb950!important;color:#04260a}
.wkey.bad,.bkey.bad{background:#f85149!important;color:#2d0505}
.wkey.reveal{box-shadow:inset 0 0 0 3px #238636}
.hint{color:#9aa4b2;font-size:.8rem;margin:10px 0 0}
</style>
</head>
<body>
<h1>🎼 Note Exerciser</h1>

<div id="setup" class="panel">
  <label>Clef
    <select id="clef">
      <option value="treble">Treble</option>
      <option value="bass">Bass</option>
      <option value="alto">Alto</option>
      <option value="tenor">Tenor</option>
    </select>
  </label>
  <label>Lowest note <select id="rangeFrom"></select></label>
  <label>Highest note <select id="rangeTo"></select></label>
  <label>Answer mode
    <select id="answerMode">
      <option value="it">Buttons · Solfège (Do Re Mi)</option>
      <option value="en">Buttons · Letters (C D E F G A B)</option>
      <option value="mic-relative">Microphone · relative</option>
      <option value="mic-exact">Microphone · exact</option>
      <option value="piano-relative">Piano · relative</option>
      <option value="piano-exact">Piano · exact</option>
    </select>
  </label>
  <label class="chk"><input type="checkbox" id="pianoLabels" checked> Key labels</label>
  <button id="startBtn" class="primary">▶ Start</button>
</div>

<div id="game" hidden>
  <div id="score"></div>
  <svg id="staff" viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="micStatus" hidden></div>
  <div id="feedback"></div>
  <div id="buttons"></div>
  <div id="piano" hidden></div>
  <p class="hint" id="hint">Answer by clicking or pressing keys 1–7</p>
  <button id="stopBtn">⏹ Stop</button>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const NAMES_IT = ['Do','Re','Mi','Fa','Sol','La','Si'];
const NAMES_EN = ['C','D','E','F','G','A','B'];
const SEMI = [0,2,4,5,7,9,11];
const CLEFS = {
  treble:{name:'Treble',   glyph:'\u{1D11E}', bottom:30, clefY:270, fs:95},
  bass:  {name:'Bass',     glyph:'\u{1D122}', bottom:18, clefY:265, fs:78},
  alto:  {name:'Alto', glyph:'\u{1D121}', bottom:24, clefY:270, fs:88},
  tenor: {name:'Tenor',    glyph:'\u{1D121}', bottom:22, clefY:250, fs:88}
};
const DEFAULT_RANGE = {treble:[28,39], bass:[14,25], alto:[21,32], tenor:[21,32]};

const CHROMATIC_IT = ['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const CHROMATIC_EN = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];

const state = {clef:'treble', from:28, to:39, it:true, cur:null, last:null, mode:'it',
               score:0, total:0, streak:0, best:0, awaiting:false, running:false};
let analyser = null, micStream = null, micTimer = null;
let stableCount = 0, lastCandidate = -999;

function isMicMode(){ return state.mode.startsWith('mic'); }
function isPianoMode(){ return state.mode.startsWith('piano'); }

/* ---------- audio ---------- */
let actx = null;
function ensureAudio(){
  if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === 'suspended') actx.resume();
}
function tone(f, t0, dur, type, vol){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function midiFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function playNote(freq){
  ensureAudio();
  tone(freq, actx.currentTime, 0.7, 'triangle', 0.22);
}
function correctSound(){
  ensureAudio();
  const t = actx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((f,k) => tone(f, t + k*0.07, 0.18, 'sine', 0.2));
}
function wrongSound(){
  ensureAudio();
  const t = actx.currentTime;
  const o1 = actx.createOscillator(), o2 = actx.createOscillator();
  const g = actx.createGain(), fl = actx.createBiquadFilter();
  o1.type = 'sawtooth'; o2.type = 'sawtooth';
  o1.frequency.setValueAtTime(220, t); o1.frequency.exponentialRampToValueAtTime(110, t + 0.45);
  o2.frequency.setValueAtTime(233, t); o2.frequency.exponentialRampToValueAtTime(116, t + 0.45);
  fl.type = 'lowpass'; fl.frequency.value = 900;
  g.gain.setValueAtTime(0.28, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  o1.connect(fl); o2.connect(fl); fl.connect(g); g.connect(actx.destination);
  o1.start(t); o2.start(t); o1.stop(t + 0.55); o2.stop(t + 0.55);
}

/* ---------- staff rendering ---------- */
function diaToY(d, clef){ return 310 - (d - CLEFS[clef].bottom) * 10; }
function renderStaff(n){
  const c = CLEFS[state.clef];
  const ny = diaToY(n.dia, state.clef);
  const VIEW_H = 420;
  const cY = Math.min(Math.max((ny + 270) / 2, -120 + VIEW_H / 2), 560 - VIEW_H / 2);
  $('staff').setAttribute('viewBox', `0 ${cY - VIEW_H / 2} 600 ${VIEW_H}`);
  let s = '';
  for(let k = 0; k < 5; k++){
    const y = 230 + k * 20;
    s += `<line x1="40" y1="${y}" x2="560" y2="${y}" stroke="#8b949e" stroke-width="1.5"/>`;
  }
  const ledger = p => {
    const y = diaToY(p, state.clef);
    return `<line x1="272" y1="${y}" x2="328" y2="${y}" stroke="#8b949e" stroke-width="1.5"/>`;
  };
  const top = c.bottom + 8;
  if(n.dia > top){
    const end = n.dia + (((n.dia - c.bottom) % 2 === 0) ? 0 : 1);
    for(let p = top + 2; p <= end; p += 2) s += ledger(p);
  }
  if(n.dia < c.bottom){
    const end = n.dia - (((n.dia - c.bottom) % 2 === 0) ? 0 : 1);
    for(let p = c.bottom - 2; p >= end; p -= 2) s += ledger(p);
  }
  s += `<text x="75" y="${c.clefY}" font-size="${c.fs}" fill="#e6edf3" text-anchor="middle" dominant-baseline="central" font-family="'Noto Music','Bravura','Segoe UI Symbol','Apple Symbols',serif">${c.glyph}</text>`;
  s += `<text x="75" y="342" font-size="13" fill="#9aa4b2" text-anchor="middle">${c.name}</text>`;
  const y = ny;
  s += `<ellipse cx="300" cy="${y}" rx="10" ry="7" fill="#e6edf3" transform="rotate(-15 300 ${y})"/>`;
  $('staff').innerHTML = s;
}

/* ---------- game logic ---------- */
function randNote(){
  let d;
  do { d = state.from + Math.floor(Math.random() * (state.to - state.from + 1)); }
  while(d === state.last && state.to > state.from);
  state.last = d;
  return {dia:d, o:Math.floor(d / 7), i:d % 7};
}
function noteMidi(n){ return 12 * (n.o + 1) + SEMI[n.i]; }
function nextNote(){
  if(!state.running) return;
  state.cur = randNote();
  state.awaiting = true;
  renderStaff(state.cur);
  if(!isMicMode()) playNote(midiFreq(state.cur));
}
function updateScore(){
  $('score').textContent = `✅ ${state.score}/${state.total} · 🔥 streak ${state.streak} · 🏆 best ${state.best}`;
}
function answer(i){
  if(!state.awaiting || !state.running) return;
  const btn = document.querySelectorAll('#buttons button')[i];
  answerValue(i === state.cur.i, btn);
}
function answerValue(ok, pressedIdx){
  state.awaiting = false;
  state.total++;
  if(ok){ state.score++; state.streak++; state.best = Math.max(state.best, state.streak); correctSound(); }
  else  { state.streak = 0; wrongSound(); }
  updateScore();
  flash(ok, pressedIdx);
  setTimeout(nextNote, ok ? 450 : 1000);
}
function flash(ok, pressedEl){
  let correctEl;
  if(isPianoMode()) correctEl = document.querySelector(`.wkey[data-dia="${state.cur.dia}"]`);
  else correctEl = document.querySelectorAll('#buttons button')[state.cur.i];
  if(correctEl) correctEl.classList.add(ok ? 'ok' : 'reveal');
  if(!ok && pressedEl) pressedEl.classList.add('bad');
  const fb = $('feedback');
  fb.textContent = ok ? '✔ Correct!' : `✘ It was ${(state.it ? NAMES_IT : NAMES_EN)[state.cur.i]}${state.cur.o}`;
  fb.className = ok ? 'ok' : 'bad';
  setTimeout(() => {
    document.querySelectorAll('.note-btn,.wkey,.bkey').forEach(b => b.classList.remove('ok','bad','reveal'));
  }, ok ? 400 : 950);
}

/* ---------- microfono ---------- */
async function startMic(){
  ensureAudio();
  micStream = await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}
  });
  const src = actx.createMediaStreamSource(micStream);
  analyser = actx.createAnalyser();
  analyser.fftSize = 2048;
  src.connect(analyser);
}
function stopMic(){
  if(micTimer){ clearInterval(micTimer); micTimer = null; }
  if(micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  analyser = null;
}
function midiFromFreq(f){ return 69 + 12 * Math.log2(f / 440); }
function autoCorrelate(buf, sampleRate){
  const SIZE = buf.length;
  let rms = 0;
  for(let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if(rms < 0.015) return -1;
  let r1 = 0, r2 = SIZE - 1;
  const thres = 0.2;
  for(let i = 0; i < SIZE / 2; i++) if(Math.abs(buf[i]) < thres){ r1 = i; break; }
  for(let i = 1; i < SIZE / 2; i++) if(Math.abs(buf[SIZE - i]) < thres){ r2 = SIZE - i; break; }
  const b = buf.slice(r1, r2);
  const N = b.length;
  if(N < 64) return -1;
  const c = new Float32Array(N);
  for(let i = 0; i < N; i++)
    for(let j = 0; j < N - i; j++)
      c[i] += b[j] * b[j + i];
  let d = 0;
  while(d < N - 1 && c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for(let i = d; i < N; i++){ if(c[i] > maxval){ maxval = c[i]; maxpos = i; } }
  if(maxpos <= 0 || maxpos >= N - 1) return -1;
  let T0 = maxpos;
  const x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
  const a = (x1 + x3 - 2 * x2) / 2, bb = (x3 - x1) / 2;
  if(a) T0 = T0 - bb / (2 * a);
  return sampleRate / T0;
}
function micLoop(){
  if(!state.running || !analyser) return;
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  const f = autoCorrelate(buf, actx.sampleRate);
  const el = $('micStatus');
  if(f > 0){
    const m = midiFromFreq(f);
    const cand = Math.round(m);
    const pcNames = state.it ? CHROMATIC_IT : CHROMATIC_EN;
    const cents = Math.round((m - cand) * 100);
    el.textContent = `🎤 ${pcNames[((cand % 12) + 12) % 12]}${Math.floor(cand / 12) - 1} (${cents > 0 ? '+' : ''}${cents}¢)`;
    if(cand === lastCandidate) stableCount++;
    else { stableCount = 1; lastCandidate = cand; }
    if(stableCount >= 4 && state.awaiting){
      const ok = state.mode === 'mic-exact'
        ? cand === noteMidi(state.cur)
        : ((cand % 12) + 12) % 12 === SEMI[state.cur.i];
      stableCount = 0; lastCandidate = -999;
      answerValue(ok);
    }
  } else {
    el.textContent = '🎤 Listening…';
    stableCount = 0; lastCandidate = -999;
  }
}

/* ---------- ui ---------- */
function buildButtons(){
  const box = $('buttons');
  box.innerHTML = '';
  for(let i = 0; i < 7; i++){
    const b = document.createElement('button');
    b.className = 'note-btn';
    b.addEventListener('click', () => answer(i));
    box.appendChild(b);
  }
  relabel();
}
function relabel(){
  [...document.querySelectorAll('#buttons button')].forEach((b,i) => {
    b.textContent = (state.it ? NAMES_IT : NAMES_EN)[i];
  });
}
function buildPiano(){
  const box = $('piano');
  box.innerHTML = '';
  let dias = [];
  if(state.mode === 'piano-relative'){
    for(let i = 0; i < 7; i++) dias.push(28 + i);
  } else {
    const startOct = Math.floor(state.from / 7), endOct = Math.floor(state.to / 7);
    for(let o = startOct; o <= endOct; o++)
      for(let i = 0; i < 7; i++){
        const dia = o * 7 + i;
        if(dia >= state.from && dia <= state.to) dias.push(dia);
      }
  }
  const rel = state.mode === 'piano-relative';
  const showLabels = $('pianoLabels').checked;
  const names = state.it ? NAMES_IT : NAMES_EN;
  const SHARP_IT = {0:'Do♯',1:'Re♯',3:'Fa♯',4:'Sol♯',5:'La♯'};
  const SHARP_EN = {0:'C♯',1:'D♯',3:'F♯',4:'G♯',5:'A♯'};
  const sh = state.it ? SHARP_IT : SHARP_EN;
  const N = dias.length, ww = 100 / N, bw = ww * 0.6;
  dias.forEach(dia => {
    const k = document.createElement('div');
    k.className = 'wkey';
    k.dataset.dia = dia;
    if(showLabels) k.textContent = names[dia % 7] + (rel ? '' : Math.floor(dia / 7));
    k.addEventListener('click', () => pianoAnswer(dia, k));
    box.appendChild(k);
  });
  for(let j = 0; j < N - 1; j++){
    const lo = dias[j], i = lo % 7;
    if(dias[j + 1] - lo !== 1 || !(i in sh)) continue;
    const b = document.createElement('div');
    b.className = 'bkey';
    b.style.left = (((j + 1) * ww) - bw / 2) + '%';
    b.style.width = bw + '%';
    if(showLabels) b.textContent = sh[i];
    const midi = 12 * (Math.floor(lo / 7) + 1) + SEMI[i] + 1;
    b.addEventListener('click', () => playNote(midiFreq(midi)));
    box.appendChild(b);
  }
}
function pianoAnswer(dia, el){
  if(!state.awaiting || !state.running) return;
  const n = {dia, o:Math.floor(dia / 7), i:dia % 7};
  playNote(midiFreq(noteMidi(n)));
  const ok = state.mode === 'piano-exact' ? dia === state.cur.dia : n.i === state.cur.i;
  answerValue(ok, el);
}
(function initRanges(){
  for(const sel of [$('rangeFrom'), $('rangeTo')]){
    for(let d = 14; d <= 56; d++){
      const o = Math.floor(d / 7), i = d % 7;
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = `${NAMES_EN[i]}${o} (${NAMES_IT[i]}${o})`;
      sel.appendChild(opt);
    }
  }
  $('rangeFrom').value = 28;
  $('rangeTo').value = 39;
})();
$('clef').addEventListener('change', () => {
  const [a,b] = DEFAULT_RANGE[$('clef').value];
  $('rangeFrom').value = a;
  $('rangeTo').value = b;
});
$('startBtn').addEventListener('click', async () => {
  ensureAudio();
  state.mode = $('answerMode').value;
  state.it = state.mode === 'it';
  let a = +$('rangeFrom').value, b = +$('rangeTo').value;
  if(a > b) [a,b] = [b,a];
  state.from = a; state.to = b;
  state.clef = $('clef').value;
  state.score = 0; state.total = 0; state.streak = 0; state.best = 0; state.last = null;
  const mic = isMicMode(), piano = isPianoMode();
  if(mic){
    try {
      await startMic();
    } catch(err) {
      $('feedback').className = 'bad';
      $('feedback').textContent = '⚠ Cannot access the microphone';
      return;
    }
  }
  state.running = true;
  $('game').hidden = false;
  $('feedback').textContent = '';
  $('buttons').hidden = mic || piano;
  $('piano').hidden = !piano;
  $('micStatus').hidden = !mic;
  $('hint').textContent =
    mic  ? (state.mode === 'mic-exact'   ? 'Sing the exact note!' : 'Sing the note: any octave works!') :
    piano? (state.mode === 'piano-exact' ? 'Press the exact key!' : 'Press the right key: any octave works!') :
           'Answer by clicking or pressing keys 1–7';
  if(mic){ stableCount = 0; lastCandidate = -999; micTimer = setInterval(micLoop, 80); }
  else if(piano) buildPiano();
  else relabel();
  updateScore();
  nextNote();
});
$('stopBtn').addEventListener('click', () => {
  state.running = false;
  state.awaiting = false;
  stopMic();
  $('game').hidden = true;
});
document.addEventListener('keydown', e => {
  if($('game').hidden || isMicMode()) return;
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= 7) answer(n - 1);
});

buildButtons();
</script>
</body>
</html>
